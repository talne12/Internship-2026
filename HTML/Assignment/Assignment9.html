<body style="background-color:royalblue; color:white;height:300px; width: 600px;  ">
  <fieldset style=" height:300px; width: 600px; "  >
            <legend>Registration Details</legend>
        <center>
            <label for="">University:</label>
            <input type="name"/><br><br>

            <label for="">Institute:</label>
            <input type="text"/><br><br>

            <label for="">Branch:</label>
            <select>
                <option>--select--</option>
                <option>Information Technology</option>
                <option>Computer</option>
                <option>ME</option>
                <option>CE</option>
                <option>EE</option>
            </select><br><br>

            <label for="">Degree:</label>
            <select>
                <option>--select--</option>
                <option>Pursuing</option>
                <option>Completed</option>
            </select>
            <input type="radio" name="Degree"/>Pursuing
            <input type="radio" name="Degree"/>Completed<br><br>

            <label for="">Average CPI:</label>
            <input type="number" style="height: 16px; width: 28px;"/>
            <label for="">Upto:</label>
            <input type="number" style="height: 16px; width: 28px;">Th Semester<br><br>

            <label for="">Experience:</label>
            <input type="number" style="height:20px; width:32px;"/>Years<br><br>
          

            <label for="">Your Website or Blog:</label>
            <input type="text" placeholder="http://"/><br><br>
