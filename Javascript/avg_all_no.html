        />

    <body>
        //Write a JavaScript program to find the average of all numbers in an array using a for...in loop.
        <h2 id="demo"></h2>
        <p id="a"></p>
        <script>
            let arr=[80,60.79,90,74];
            let sum=0;
            let count=0;
            for(let i in arr){
                sum=sum+arr[i];
                count++;
            }
            let avg=sum/count;
            console.log("sum="+sum);
            console.log("average="+avg);
            document.getElementById("demo").innerHTML=+sum;
            document.getElementById("p").innerHTML=+avg;
        </script>   
    </body>
</html>
