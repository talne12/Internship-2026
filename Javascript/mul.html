<!doctype html>
<html lang="en" data-bs-theme="light">
    <head>
        <title>Title</title>
        <!-- Required meta tags -->
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />

        <!-- Bootstrap CSS v5.3.8 -->

        />

    <body>
        <p id="demo"></p>
        <script>
            let arr=[2,4,6,8];
            let mul=1;
            for (let i in arr){
                mul=mul*arr[i];

            }
            console.log("Multiplication of all elemennts="+mul);
            document.getElementById("demo").innerHTML=mul;
        </script>
    </body>
